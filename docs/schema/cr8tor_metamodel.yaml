    slots:
    - governance__users
    - governance__project
    attributes:
      users:
        name: users
        description: List of users who have access to the project, each with their
          own roles, permissions, and membership details. Represents the state of
          project membership and access control.
        range: User
        multivalued: true
        inlined_as_list: true
      project:
        name: project
        description: The project entity governed by this governance model, containing
          core project metadata and state.
        range: Project
    class_uri: cr8tor_metamodel:Governance
  Project:
    name: Project
    definition_uri: https://w3id.org/karectl-crates/governance-model/Project
    description: Defines the core state and identifying properties of a Cr8tor project,
      including its name, description, and reference information. This class models
