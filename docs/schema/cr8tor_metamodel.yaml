          membership, and project metadata. Required.
        range: Governance
        required: true
      ingress:
        name: ingress
        description: The data ingress configuration for the project, specifying data
          sources, destinations, and datasets involved in data movement. Required.
        range: Ingress
        required: true
      deployment:
        name: deployment
        description: The deployment configuration for the project, detailing the resources
          and environment to be provisioned. Required.
        range: Deployment
        required: true
    class_uri: cr8tor_metamodel:Cr8tor
    tree_root: true
  Governance:
