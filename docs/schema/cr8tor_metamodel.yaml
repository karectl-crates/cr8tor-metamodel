name: cr8tor-metamodel
description: Cr8tor metamodel project
title: cr8tor-metamodel
see_also:
- https://karectl-crates.github.io/cr8tor-metamodel
id: https://w3id.org/karectl-crates/cr8tor-metamodel
imports:
- governance_model
- data_model
- deployment_model
- linkml:types
license: MIT
prefixes:
  cr8tor_metamodel:
    prefix_prefix: cr8tor_metamodel
    prefix_reference: https://w3id.org/karectl-crates/cr8tor-metamodel/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  example:
    prefix_prefix: example
    prefix_reference: https://example.org/
default_prefix: cr8tor_metamodel
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  GroupMembershipType:
    name: GroupMembershipType
    definition_uri: https://w3id.org/karectl-crates/governance-model/GroupMembershipType
    description: Type of TRE group membership
    from_schema: https://w3id.org/karectl-crates/governance-model
    permissible_values:
      Manual:
        text: Manual
        description: Manually assigned group membership
      Automatic:
        text: Automatic
        description: Automatically assigned group membership
  DestinationType:
    name: DestinationType
    definition_uri: https://w3id.org/karectl-crates/data-model/DestinationType
    from_schema: https://w3id.org/karectl-crates/data-model
    permissible_values:
      filestore:
        text: filestore
        description: Filestore endpoint
      postgresql:
        text: postgresql
        description: PostgreSQL database endpoint
slots:
  cr8tor__governance:
    name: cr8tor__governance
    description: The governance configuration for the project, managing user access,
      membership, and project metadata. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:governance
    alias: governance
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Governance
    required: true
    inlined: true
    inlined_as_list: true
  cr8tor__ingress:
    name: cr8tor__ingress
    description: The data ingress configuration for the project, specifying data sources,
      destinations, and datasets involved in data movement. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:ingress
    alias: ingress
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Ingress
    required: true
    inlined: true
    inlined_as_list: true
  cr8tor__deployment:
    name: cr8tor__deployment
    description: The deployment configuration for the project, detailing the resources
      and environment to be provisioned. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:deployment
    alias: deployment
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Deployment
    required: true
    inlined: true
    inlined_as_list: true
  governance__users:
    name: governance__users
    description: List of users who have access to the project, each with their own
      roles, permissions, and membership details. Represents the state of project
      membership and access control.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:users
    alias: users
    owner: Governance
    domain_of:
    - Governance
    range: User
    multivalued: true
    inlined: true
    inlined_as_list: true
  governance__project:
    name: governance__project
    description: The project entity governed by this governance model, containing
      core project metadata and state.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:project
    alias: project
    owner: Governance
    domain_of:
    - Governance
    range: Project
    inlined: true
    inlined_as_list: true
  project__name:
    name: project__name
    description: The unique name of the Cr8tor project, used for identification and
      reference within the system.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: Project
    domain_of:
    - Project
    range: string
  project__description:
    name: project__description
    description: A brief summary describing the purpose, scope, or objectives of the
      Cr8tor project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:description
    alias: description
    owner: Project
    domain_of:
    - Project
    range: string
  project__reference:
    name: project__reference
    description: An external or internal reference identifier for the Cr8tor project,
      used for cross-referencing or linking to related resources.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:reference
    alias: reference
    owner: Project
    domain_of:
    - Project
    range: string
  user__id:
    name: user__id
    description: A globally unique identifier for the user, ensuring unambiguous reference
      within and across systems.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schema-org:identifier
    slot_uri: schema-org:identifier
    identifier: true
    alias: id
    owner: User
    domain_of:
    - User
    range: uriorcurie
    required: true
  user__username:
    name: user__username
    description: The user's unique login or account name, used for authentication
      and identification within the project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schema-org:identifier
    slot_uri: schema-org:identifier
    alias: username
    owner: User
    domain_of:
    - User
    range: uriorcurie
  user__given_name:
    name: user__given_name
    description: The user's first or given name, representing their personal identity.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schema-org:name
    slot_uri: schema-org:name
    alias: given_name
    owner: User
    domain_of:
    - User
    range: string
  user__family_name:
    name: user__family_name
    description: The user's last or family name, used for identification and display
      purposes.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:family_name
    alias: family_name
    owner: User
    domain_of:
    - User
    range: string
  user__affiliation:
    name: user__affiliation
    description: The name of the organization or institution with which the user is
      affiliated, representing their organizational context.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:affiliation
    alias: affiliation
    owner: User
    domain_of:
    - User
    range: string
  user__email:
    name: user__email
    description: The user's email address, used for communication and notifications
      related to the project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:email
    alias: email
    owner: User
    domain_of:
    - User
    range: string
  user__groups:
    name: user__groups
    description: List of groups to which the user belongs within the project, representing
      roles, permissions, or organizational units.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:groups
    alias: groups
    owner: User
    domain_of:
    - User
    range: Group
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
  user__start_date:
    name: user__start_date
    description: The date and time when the user's access to the project becomes active,
      representing the start of their membership or role.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:start_date
    alias: start_date
    owner: User
    domain_of:
    - User
    range: datetime
  user__expiry_date:
    name: user__expiry_date
    description: The date and time when the user's access to the project expires,
      representing the end of their membership or role.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:expiry_date
    alias: expiry_date
    owner: User
    domain_of:
    - User
    range: datetime
  group__value:
    name: group__value
    annotations:
      mutability:
        tag: mutability
        value: readOnly
    description: The unique identifier of the group, typically used as the group ID
      for referencing and access control. Read-only.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:value
    alias: value
    owner: Group
    domain_of:
    - Group
    range: string
    required: false
  group__ref:
    name: group__ref
    annotations:
      mutability:
        tag: mutability
        value: readOnly
      reference_type:
        tag: reference_type
        value: Group
    description: The URI reference to the corresponding Group resource, enabling linkage
      to external or internal group definitions. Read-only.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:ref
    alias: ref
    owner: Group
    domain_of:
    - Group
    range: uri
    required: false
  group__display:
    name: group__display
    annotations:
      mutability:
        tag: mutability
        value: readOnly
    description: A human-readable display name for the group, used for UI and reporting.
      Read-only.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:display
    alias: display
    owner: Group
    domain_of:
    - Group
    range: string
    required: false
  group__type:
    name: group__type
    annotations:
      mutability:
        tag: mutability
        value: readOnly
    description: The type of group membership, indicating how the user was assigned
      to the group (e.g., manual or automatic). Read-only.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:type
    alias: type
    owner: Group
    domain_of:
    - Group
    range: GroupMembershipType
    required: false
  ingress__source:
    name: ingress__source
    description: The origin or source of data for the ingress process, representing
      where data is extracted from. Optional.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:source
    alias: source
    owner: Ingress
    domain_of:
    - Ingress
    range: Source
    required: false
    inlined: true
    inlined_as_list: true
  ingress__destination:
    name: ingress__destination
    description: The target or endpoint where data is delivered during the ingress
      process, representing the state of data delivery. Required.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:destination
    alias: destination
    owner: Ingress
    domain_of:
    - Ingress
    range: Destination
    required: true
    inlined: true
    inlined_as_list: true
  ingress__datasets:
    name: ingress__datasets
    description: List of datasets involved in the ingress process, each representing
      a collection of data to be transferred. Optional, can include multiple datasets.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:datasets
    alias: datasets
    owner: Ingress
    domain_of:
    - Ingress
    range: Dataset
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
  source__url:
    name: source__url
    description: The URL or location of the data source, specifying where data can
      be accessed or retrieved from.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:url
    alias: url
    owner: Source
    domain_of:
    - Source
    range: string
  destination__type:
    name: destination__type
    description: The type of destination (e.g., filestore, postgresql), specifying
      the nature of the data endpoint. Required.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:type
    alias: type
    owner: Destination
    domain_of:
    - Destination
    range: DestinationType
    required: true
  destination__url:
    name: destination__url
    description: The URL or location of the data destination, specifying where data
      should be delivered. Optional.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:url
    alias: url
    owner: Destination
    domain_of:
    - Destination
    range: string
    required: false
  dataset__name:
    name: dataset__name
    description: The name of the dataset, used for identification and reference within
      the project. Required.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: Dataset
    domain_of:
    - Dataset
    range: string
    required: true
  dataset__schema_name:
    name: dataset__schema_name
    description: The name of the schema in the target database where the dataset will
      reside. Required.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:schema_name
    alias: schema_name
    owner: Dataset
    domain_of:
    - Dataset
    range: string
    required: true
  dataset__tables:
    name: dataset__tables
    description: List of tables that make up the dataset, each representing a structured
      collection of columns and data. Optional, can include multiple tables.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:tables
    alias: tables
    owner: Dataset
    domain_of:
    - Dataset
    range: Table
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
  dataset__locations:
    name: dataset__locations
    description: List of data locations or URIs where the dataset is stored or accessed
      during the TRE ingestion workflow. Can include strings, integers, or booleans
      to represent various location types. Optional, can include multiple locations.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:locations
    alias: locations
    owner: Dataset
    domain_of:
    - Dataset
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
    any_of:
    - range: string
    - range: integer
    - range: boolean
  table__name:
    name: table__name
    description: The name of the table, used for identification within the dataset.
      Required.
    from_schema: https://w3id.org/karectl-crates/data-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: Table
