classes:
  cr8tor:
    name: cr8tor
    definition_uri: https://w3id.org/karectl-crates/cr8tor-metamodel/Cr8tor
    description: The root container class for the Cr8tor metamodel, aggregating all
      project data including governance, data ingress, and deployment configuration.
      This class represents the complete state of a Cr8tor project instance.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
