        description: A brief summary describing the purpose, scope, or objectives
          of the Cr8tor project.
      reference:
        name: reference
        description: An external or internal reference identifier for the Cr8tor project,
          used for cross-referencing or linking to related resources.
    class_uri: cr8tor_metamodel:Project
  User:
    name: User
    definition_uri: https://w3id.org/karectl-crates/governance-model/User
    description: Models an individual user associated with a Cr8tor project, capturing
      their identity, contact information, organizational affiliation, group memberships,
