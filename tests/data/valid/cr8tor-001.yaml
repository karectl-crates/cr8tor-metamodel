# Example data object
---

governance:
  users:
    - id: https://example.org/users/jsmith
      username: jsmith
      given_name: John
      family_name: Smith
      affiliation: Example University
      email: jsmith@example.org

    - id: https://example.org/users/mjones
      username: mjones
      given_name: Mary
      family_name: Jones
      affiliation: Example University
      email: mjones@example.org

    - id: https://example.org/users/rchen
      username: rchen
      given_name: Robert
      family_name: Chen
      affiliation: Example University
      email: rchen@example.org

  project:
    name: example-project
    description: Example project
    reference: CR8TOR-002

ingress:
  source:
    name: example-source
    type: postgresql
    url: https://example.org/data/source.csv
    credentials:
      provider: azure-key-vault
      username_key: db-username
      password_key: db-password
  destination:
    type: filestore
    url: https://example.org/data/sink.csv
  datasets:
    - name: example_dataset
      schema_name: public
      tables:
        - name: abc_table
          columns:
            - name: user_id
              datatype: integer
            - name: email
              datatype: varchar
            - name: created_at
              datatype: timestamp
        - name: xyz_table
          columns:
            - name: user_id
              datatype: varchar
            - name: total_amount
              datatype: varchar

deployment:
  environment:
    name: test-env
  resources:
    - name: rstudio
      resource_type: RStudio
      url: https://rstudio.example.org
      enabled: true
