description: Example project specification with resource limits
resources:
  - name: jupyterhub-main
    resource_type: Jupyter
    url: https://jupyter.example.org
    enabled: true
    auth: oidc
limit_range:
  default_memory: 4Gi
  default_cpu: 500m
  default_request_memory: 1Gi
  default_request_cpu: 100m
