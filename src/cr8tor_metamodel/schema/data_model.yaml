---
id: https://w3id.org/karectl-crates/data-model
name: data-model
title: data-model
description: |-
  Data model
license: MIT
see_also:
  - https://karectl-crates.github.io/cr8tor-metamodel

prefixes:
  cr8tor: https://w3id.org/karectl-crates/cr8tor-metamodel/
  schemaorg: http://schema.org/
default_prefix: cr8tor_metamodel
default_range: string

imports:
  - linkml:types

classes:

  Ingress:
    description:  >-
      Represents the data ingress process for a Cr8tor project, modeling the flow of data from sources to destinations, and the datasets involved. This class captures the state of data movement and configuration for project data pipelines.
    attributes:
      source:
        description: The origin or source of data for the ingress process, representing where data is extracted from. Optional.
        range: Source
        required: false
      destination:
        description: The target or endpoint where data is delivered during the ingress process, representing the state of data delivery. Required.
        range: Destination
        required: true
      datasets:
        description: List of datasets involved in the ingress process, each representing a collection of data to be transferred. Optional, can include multiple datasets.
        range: Dataset
        required: false
        multivalued: true
        inlined_as_list: true
  Source:
    description: >-
      Models a data source within a Cr8tor project, representing the origin of data to be ingested. This class defines the state and configuration of external or internal data sources.
    attributes:
      name:
        range: string
        description: The name of the data source, used for identification and reference.
        required: false
      type:
        range: string
        description: The type of data source (e.g., databricks, postgresql, mssql, filestore).
        required: false
      url:
        range: string
        description: The URL or location of the data source, specifying where data can be accessed or retrieved from.
      credentials:
        range: Credential
        description: The credentials required to access the data source, including authentication provider and key references.
        required: false

  Credential:
    description: >-
      Models authentication credentials for accessing a data source, including the provider and references to password and username keys stored in a secure credential store.
    attributes:
      provider:
        range: string
        description: The credential provider or authentication service (e.g., Azure Key Vault, AWS Secrets Manager, HashiCorp Vault).
        required: true
      password_key:
        range: string
        description: The key or identifier used to retrieve the password from the credential provider.
        required: true
      username_key:
        range: string
        description: The key or identifier used to retrieve the username from the credential provider.
        required: true

  Destination:
    description: >-
      Models a data destination within a Cr8tor project, representing the endpoint where data is delivered or stored after ingress. This class defines the state and configuration of data targets.
    attributes:
      type:
        range: DestinationType
        description: The type of destination (e.g., filestore, postgresql), specifying the nature of the data endpoint. Required.
        required: true
      url:
        range: string
        description: The URL or location of the data destination, specifying where data should be delivered. Optional.
        required: false
  Dataset:
    description: >-
      Represents a dataset to be ingested or managed within a Cr8tor project, including its metadata, schema, tables, and data locations. This class models the state and structure of data collections handled by the project.
    attributes:
      name:
        range: string
        description: The name of the dataset, used for identification and reference within the project. Required.
        required: true
      schema_name:
        range: string
        description: The name of the schema in the target database where the dataset will reside. Required.
        required: true
      tables:
        range: Table
        description: List of tables that make up the dataset, each representing a structured collection of columns and data. Optional, can include multiple tables.
        required: false
        multivalued: true
        inlined_as_list: true
      locations:
        range: Location
        description: List of data locations or URIs where the dataset is stored or accessed during the TRE ingestion workflow. Accepts arbitrary data structures including dictionaries. Optional, can include multiple locations.
        required: false
        multivalued: true
        inlined: true
        inlined_as_list: true

  Location:
    description: >-
      Represents a data location with flexible attributes to accommodate various storage types and metadata.
    class_uri: linkml:Any
    tree_root: true


  Table:
    description: >-
      Models a table within a dataset, representing a structured collection of data organized into columns. This class defines the state and schema of tabular data in the project.
    attributes:
      name:
        range: string
        description: The name of the table, used for identification within the dataset. Required.
        required: true
      columns:
        range: Column
        description: List of columns that define the schema of the table, each representing a data field. Required, can include multiple columns.
        required: true
        multivalued: true
        inlined_as_list: true
  Column:
    description: >-
      Models a column within a table, representing a single field of data with a specific datatype. This class defines the state and schema of individual data fields in tabular structures.
    attributes:
      name:
        range: string
        description: The name of the column, used for identification within the table. Required.
        required: true
      datatype:
        range: string
        description: The datatype of the column, specifying the kind of data stored (e.g., string, integer). Required.
        required: true

enums:
  DestinationType:
    permissible_values:
      filestore:
        description: Filestore endpoint
      postgresql:
        description: PostgreSQL database endpoint