---
id: https://w3id.org/karectl-crates/deployment-model
name: deployment-model
title: deployment-model
description: |-
  Cr8tor metamodel project
license: MIT
see_also:
  - https://karectl-crates.github.io/cr8tor-metamodel

prefixes:
  cr8tor: https://w3id.org/karectl-crates/cr8tor-metamodel/
  schemaorg: http://schema.org/
  scim: "urn:ietf:params:scim:schemas:core:2.0"
default_prefix: cr8tor_metamodel
default_range: string

imports:
  - linkml:types

slots:
  resource_type:
    description: The type of resource (e.g., Jupyter, Keycloak, VDI).
    range: string
    required: true
    designates_type: true

classes:
  Deployment:
    description:  Models the deployment configuration for a Cr8tor project, specifying the K8TRE resources and applications to be provisioned, as well as the target environment. This class represents the state and desired configuration for project deployments.
    attributes:
      resources:
        description: List of resource names or identifiers representing the K8TRE applications or services to be deployed as part of the project. Can include multiple resources.
        range: Resource
        multivalued: true
        inlined_as_list: true
      environment:
        description: The environment configuration for the deployment, specifying the target trusted research environment (TRE) and its properties.
        range: Environment

  Resource:
    description: >-
      Abstract base class for K8TRE resources (such as applications or services) that can be deployed through a Cr8tor project. This class defines the state and configuration of deployable resources.
    slots:
      - resource_type
    attributes:
      name:
        description: The requested name of the resource, used for identification and management within the deployment.
        range: string
        required: true
      url:
        description: The URL endpoint for accessing the application or resource after deployment.
        range: uri
        required: true
      enabled:
        description: Boolean flag indicating whether the application or resource is enabled and available for use.
        range: boolean
        required: true

  Jupyter:
    is_a: Resource
    description: >-
      Specialized resource configuration for deploying Jupyter workspaces within a Cr8tor project. This class extends Resource to include Jupyter-specific settings and state.
    attributes:
      auth:
        description: The type or method of authentication required to access the Jupyter workspace (e.g., OAuth, SSO).
      profiles:
        range: ProfileConfig
        multivalued: true
        inlined_as_list: true
        description: JupyterHub workspace profiles for this deployment.
      storage:
        range: ResourceStorage
        required: false
        inlined: true
        description: Storage configuration for notebook workspaces.

  Keycloak:
    is_a: Resource
    description: >-
      Specialized resource configuration for deploying Keycloak identity and access management services within a Cr8tor project. This class extends Resource to include Keycloak-specific settings and state.
    attributes:
      realm:
        description: The Keycloak realm name for this project deployment.
      clients:
        range: KeycloakClientConfig
        multivalued: true
        inlined_as_list: true
        description: OIDC clients to be managed in this Keycloak deployment.

  VDI:
    is_a: Resource
    description: >-
      Virtual Desktop Infrastructure resource for cr8tor project. The operator creates a pod and Service for each VDI instance, and manages user access and lifecycle. This class extends Resource to include VDI-specific configuration.
    attributes:
      image:
        range: string
        required: false
        ifabsent: "string(ghcr.io/karectl/vdi-mate:v1.0.0-light)"
        description: Container image for the VDI.
      user:
        range: string
        required: false
        description: Username for the VDI session.
      project:
        range: string
        required: false
        description: Project this VDI belongs to.
      url:
        range: uri
        required: false
        description: Not used for VDI; VDI access is managed via the operator.
      connection:
        range: ConnectionType
        required: false
        ifabsent: "string(rdp)"
        description: Connection protocol
      env:
        range: EnvironmentVariable
        multivalued: true
        inlined_as_list: true
        description: Environment variables for the VDI container.
      scheduling:
        range: VdiScheduling
        required: false
        inlined: true
        description: Resource scheduling configuration for VDI.
      storage:
        range: ResourceStorage
        required: false
        inlined: true
        description: Storage configuration for VDI.

  RStudio:
    is_a: Resource
    description: >-
      RStudio workspace resource for cr8tor project.

  Gitea:
    is_a: Resource
    description: >-
      Gitea git repository resource for cr8tor project.

  Environment:
    description: >-
      Models the configuration of the target trusted research environment (TRE) for a Cr8tor project deployment, including environment-specific settings and metadata.
    attributes:
      name:
        description: The name of the environment or TRE where the project will be deployed, used for identification and management.

  # -------------------------------------------------------------------------
  # Operator CRD spec classes
  # -------------------------------------------------------------------------

  ProjectSpec:
    description: >-
      Operator project specification to define the resources for a research project namespace.
    attributes:
      description:
        range: string
        required: true
        description: Project description.
      resources:
        range: Resource
        multivalued: true
        inlined_as_list: true
        description: Resources (applications/services) available in this project.

  GroupSpec:
    description: >-
      Operator group specification for managing keycloak groups and setting up workspace storage for group members.
    attributes:
      description:
        range: string
        required: false
        description: Descrption of the group and its purpose.
      members:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Usernames of group members.
      projects:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Project names this group grants access to.
      subgroups:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Child group names.

  # -------------------------------------------------------------------------
  # Supporting classes referenced by Resource subclasses
  # -------------------------------------------------------------------------

  KeycloakClientConfig:
    description: >-
      Configuration for a Keycloak OIDC client. The operator creates and manages these in Keycloak for project services.
    attributes:
      client_id:
        range: string
        required: true
        description: Unique Keycloak client identifier.
      name:
        range: string
        required: false
        description: client name shown in Keycloak admin console.
      secret:
        range: string
        required: false
        description: Client secret.
      secret_ref:
        range: SecretRef
        required: false
        inlined: true
        description: Reference to a k8s Secret containing the client secret.
      enabled:
        range: boolean
        required: false
        ifabsent: "true"
        description: Whether the client is enabled.
      public_client:
        range: boolean
        required: false
        ifabsent: "false"
        description: Whether this is a public client.
      redirect_uris:
        range: uri
        multivalued: true
        inlined_as_list: true
        description: Valid redirect URIs after authentication.
      web_origins:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Allowed web origins for CORS.
      protocol:
        range: string
        required: false
        ifabsent: "string(openid-connect)"
        description: Authentication protocol.
      default_client_scopes:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Default client scopes.
      optional_client_scopes:
        range: string
        multivalued: true
        inlined_as_list: true
        description: Optional client scopes.
      protocol_mappers:
        range: ProtocolMapper
        multivalued: true
        inlined_as_list: true
        description: OIDC protocol mappers.

  SecretRef:
    description: Reference to a k8s Secret.
    attributes:
      name:
        range: string
        required: true
        description: Secret name in the same namespace.
      key:
        range: string
        required: false
        ifabsent: "string(client-secret)"
        description: Key within the Secret.

  ProtocolMapper:
    description: Keycloak OIDC protocol mapper.
    attributes:
      name:
        range: string
        required: true
        description: Mapper name.
      protocol_mapper:
        range: string
        required: true
        description: Mapper type or class.
      consent_required:
        range: boolean
        required: false
        ifabsent: "false"
      config:
        range: string
        required: false
        description: Mapper configuration as JSON string.

  ProfileConfig:
    description: >-
      JupyterHub workspace profile to select different workspace environments.
    attributes:
      display_name:
        range: string
        required: true
        description: Profile name shown in jupyterhub spawner.
      description:
        range: string
        required: false
        description: Profile description.
      slug:
        range: string
        required: true
        description: URL-safe profile identifier.
      kubespawner_override:
        range: KubespawnerOverride
        required: false
        inlined: true
        description: KubeSpawner overrides for this profile.

  KubespawnerOverride:
    description: KubeSpawner override settings for a jupyterhub profile.
    attributes:
      image:
        range: string
        required: false
        description: Container image for the workspace.
      env:
        range: EnvironmentVariable
        multivalued: true
        inlined_as_list: true
        required: false
        description: Environment variables for the workspace.

  EnvironmentVariable:
    description: A name-value environment variable pair.
    attributes:
      name:
        range: string
        required: true
        description: Variable name.
      value:
        range: string
        required: true
        description: Variable value.

  VdiSchedulingResources:
    description: CPU and memory resource requests/limits for a VDI pod.
    attributes:
      requests_cpu:
        range: string
        required: false
        description: CPU request
      requests_memory:
        range: string
        required: false
        description: Memory requests
      limits_cpu:
        range: string
        required: false
        description: CPU limit
      limits_memory:
        range: string
        required: false
        description: Memory limit
  VdiScheduling:
    description: Scheduling configuration for a VDI.
    attributes:
      resources:
        range: VdiSchedulingResources
        required: false
        inlined: true
        description: CPU and memory resource requests/limits.

  ResourceStorage:
    description: Per-resource storage configuration for workspace persistent volumes.
    attributes:
      default_vdi_size:
        range: string
        required: false
        description: Default PVC size for VDI workspaces.
      default_notebook_size:
        range: string
        required: false
        description: Default PVC size for notebook workspaces.
      persist:
        range: boolean
        required: false
        description: Whether workspace storage should persist across sessions.

  # -------------------------------------------------------------------------
  # Data publishing CRD spec classes
  # -------------------------------------------------------------------------

  DataPublishJobSpec:
    description: Spec for the DataPublishJob CRD which can trigger the operator based publish pipeline.
    attributes:
      project_name:
        range: string
        required: true
      project_start_time:
        range: string
        required: true
      source:
        range: Source
        required: true
      destination:
        range: Destination
        required: true
      dataset:
        range: Dataset
        required: true
      extract_config:
        range: ExtractConfig
        required: false
      job_config:
        range: PublishJobConfig
        required: false

  PublishJobConfig:
    description: Operator-level job execution settings.
    attributes:
      backoff_limit:
        range: integer
        required: false
      ttl_after_completion:
        range: integer
        required: false
      staging_pvc_size:
        range: string
        required: false
      staging_storage_class:
        range: string
        required: false
      retain_staging_pvc_on_failure:
        range: boolean
        required: false

  OpalProjectSpec:
    description: Spec for the OpalProject CRD (for declarative Datashield Opal setup).
    attributes:
      project_name:
        range: string
        required: true
      group_name:
        range: string
        required: true
      tables:
        range: OpalTableRef
        multivalued: true
        inlined_as_list: true
      opal_config:
        range: OpalConfig
        required: true

  OpalTableRef:
    description: Reference to a table as an Opal resource.
    attributes:
      schema:
        range: string
        required: true
      name:
        range: string
        required: true

  OpalConfig:
    description: Secret references for connecting to an Opal instance.
    attributes:
      host_secret_ref:
        range: string
        required: true
      username_secret_ref:
        range: string
        required: true
      password_secret_ref:
        range: string
        required: true
      readonly_username_secret_ref:
        range: string
        required: false
      readonly_password_secret_ref:
        range: string
        required: false

enums:

  ConnectionType:
    description: VDI connection protocols.
    permissible_values:
      rdp:
        description: Remote Desktop Protocol.
      vnc:
        description: Virtual Network Computing.
