---
id: https://w3id.org/karectl-crates/governance-model
name: governance-model
title: governance-model
description: |-
  Cr8tor metamodel project
license: MIT
see_also:
  - https://karectl-crates.github.io/cr8tor-metamodel

prefixes:
  cr8tor: https://w3id.org/karectl-crates/cr8tor-metamodel/
  schemaorg: http://schema.org/
  scim: urn:ietf:params:scim:schemas:core:2.0
default_prefix: cr8tor_metamodel
default_range: string

imports:
  - linkml:types

classes:

  Governance:
    description:  Represents the governance structure of a Cr8tor project, encapsulating user access control, project membership, and mandatory project metadata. This class manages the relationships between users and the project, ensuring proper access and compliance with governance requirements.
    attributes:
      project:
        range: Project
        multivalued: false
        inlined_as_list: true
        description: The project entity governed by this governance model, containing core project metadata and state.
        required: true
      users:
        description: List of users who have access to the project, each with their own roles, permissions, and membership details. Represents the state of project membership and access control.
        range: User
        multivalued: true
        inlined_as_list: true

  
  Project:
    description: >-
      Defines the core state and identifying properties of a Cr8tor project, including its name, description, and reference information. This class models the essential metadata required to uniquely identify and describe a project within the Cr8tor ecosystem.
    attributes:
      id:
        range: string
        description: Unique identifier for the project
        required: false
      name:
        range: string
        description: The unique name of the Cr8tor project, used for identification and reference within the system.
      description:
        range: string
        description: A brief summary describing the purpose, scope, or objectives of the Cr8tor project.
      reference:
        range: string
        description: An external or internal reference identifier for the Cr8tor project, used for cross-referencing or linking to related resources.
      start_time:
        range: string
        description: Timestamp when project was created
        required: false
      actions:
        range: Action
        multivalued: true
        inlined_as_list: true
        description: List of actions performed on the cr8tor project
    narrow_mappings: 
      - schemaorg:Project

  Action:
    description: >-
      Represents an action or activity performed on a Cr8tor project, tracking the lifecycle 
      and state changes of the project. Based on schema.org Action and the Provenance Crate Profile 
      specification. Actions track operations like create, assess, validate, etc.
    attributes:
      id:
        identifier: true
        range: string
        description: Unique identifier for the action, typically formatted as '{command_type}-{project_id}'.
        required: true
      type:
        range: string
        description: The specific type of action being performed (e.g., CreateAction, AssessAction).
        required: true
        designates_type: true
      name:
        range: string
        description: Human-readable name describing the action (e.g., "CREATE Data Project Action").
        required: true
      start_time:
        range: datetime
        description: The date and time when the action started execution.
        required: true
      end_time:
        range: datetime
        description: The date and time when the action completed or failed.
        required: true
      action_status:
        range: ActionStatusType
        description: >-
          The current status of the action, indicating whether it's active, completed, failed, or potential.
          Formatted based on schema.org ActionStatus and Provenance Crate Profile specification.
        required: true
      agent:
        range: string
        description: >-
          The agent (person, organization, or software) that triggered or performed the action.
          Can reference a Person, Organization, or SoftwareApplication entity.
        required: true
      instrument:
        range: string
        description: >-
          The tool or service that executed the action (e.g., 'cr8tor CLI', 'GitHub Action', 
          specific TRE service). Maps to schema.org Action.instrument.
        required: false
      result:
        range: string
        multivalued: true
        inlined_as_list: true
        description: >-
          List of result items produced by the action, typically ID references to other 
          data or context entities created or modified by the action.
        required: false
      error:
        range: string
        description: >-
          Error message or output if the action failed. Only present when action_status is FailedActionStatus.
        required: false
    narrow_mappings:
      - schemaorg:Action

  CreateAction:
    description: >-
      Represents a create action performed on a Cr8tor project, typically used to track
      project initialization and creation events. Inherits all properties from Action.
    is_a: Action
    narrow_mappings:
      - schemaorg:CreateAction

  AssessAction:
    description: >-
      Represents an assessment action performed on a Cr8tor project, used to track
      validation, disclosure checks, and other evaluation activities. Inherits all
      properties from Action and adds an optional additional_type for sub-assessments.
    is_a: Action
    attributes:
      additional_type:
        range: string
        description: >-
          Additional type classification for specialized actions, used to reference sub-actions 
          or specific assessment types (e.g., 'disclosure check' for AssessAction).
        required: false
    narrow_mappings:
      - schemaorg:AssessAction

  User:
    description: >-
      Models an individual user associated with a Cr8tor project, capturing their identity, contact information, organizational affiliation, group memberships, and access lifecycle. This class represents the state of a user's relationship to the project and their access rights.
    attributes:
      id:
        identifier: true
        slot_uri: schemaorg:identifier
        range: uriorcurie
        description: A globally unique identifier for the user, ensuring unambiguous reference within and across systems.
      username:
        slot_uri: schemaorg:identifier
        range: uriorcurie
        description: The user's unique login or account name, used for authentication and identification within the project.
      given_name:
        slot_uri: schemaorg:name
        description: The user's first or given name, representing their personal identity.
      family_name:
        description: The user's last or family name, used for identification and display purposes.
      affiliation:
        description: The name of the organization or institution with which the user is affiliated, representing their organizational context.
      email:
        description: The user's email address, used for communication and notifications related to the project.
      groups:
        description: List of groups to which the user belongs within the project, representing roles, permissions, or organizational units.
        range: Group
        required: false
        multivalued: true
        inlined_as_list: true
      start_date:
        range: datetime
        description: The date and time when the user's access to the project becomes active, representing the start of their membership or role.
      expiry_date:
        range: datetime
        description: The date and time when the user's access to the project expires, representing the end of their membership or role.

    narrow_mappings: 
    - schemaorg:Person
    - schemaorg:Organization
    - scim:User

  Group:
    description: Represents a group or organizational unit within a Cr8tor project, used to organize users, assign roles, and manage permissions. This class models the state of group membership and its associated metadata.
    attributes:
      value:
        description: The unique identifier of the group, typically used as the group ID for referencing and access control. Read-only.
        range: string
        required: false
        annotations:
          mutability: readOnly
      ref:
        description: The URI reference to the corresponding Group resource, enabling linkage to external or internal group definitions. Read-only.
        range: uri
        required: false
        annotations:
          mutability: readOnly
          reference_type: Group
      display:
        description: A human-readable display name for the group, used for UI and reporting. Read-only.
        range: string
        required: false
        annotations:
          mutability: readOnly
      type:
        description: The type of group membership, indicating how the user was assigned to the group (e.g., manual or automatic). Read-only.
        range: GroupMembershipType
        required: false
        annotations:
          mutability: readOnly
    narrow_mappings: 
      - scim:Group

enums:
  GroupMembershipType:
    description: Type of TRE group membership
    permissible_values:
      Manual:
        description: Manually assigned group membership
      Automatic:
        description: Automatically assigned group membership

  ActionType:
    description: Types of actions that can be performed on a Cr8tor project
    permissible_values:
      Action:
        description: Generic action type
      CreateAction:
        description: Action to create or initialize a project
      AssessAction:
        description: Action to assess or evaluate a project (e.g., validation, disclosure check)
      UpdateAction:
        description: Action to update project metadata or resources
      OrchestrationAction:
        description: Action to orchestrate deployment or provisioning
  
  ActionStatusType:
    description: Status states for actions, based on schema.org ActionStatusType
    permissible_values:
      ActiveActionStatus:
        description: Action is currently in progress
      CompletedActionStatus:
        description: Action completed successfully
      FailedActionStatus:
        description: Action failed with errors
      PotentialActionStatus:
        description: Action is potential but not yet started
  
