    - KeycloakClientConfig
    range: ProtocolMapper
    multivalued: true
    inlined: true
    inlined_as_list: true
  secretRef__name:
    name: secretRef__name
    description: Secret name in the same namespace.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: SecretRef
    domain_of:
    - SecretRef
    range: string
    required: true
  secretRef__key:
    name: secretRef__key
    description: Key within the Secret.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:key
    ifabsent: string(client-secret)
    alias: key
    owner: SecretRef
    domain_of:
    - SecretRef
    range: string
    required: false
  protocolMapper__name:
    name: protocolMapper__name
    description: Mapper name.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: ProtocolMapper
    domain_of:
    - ProtocolMapper
    range: string
    required: true
  protocolMapper__protocol_mapper:
    name: protocolMapper__protocol_mapper
    description: Mapper type or class.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:protocol_mapper
    alias: protocol_mapper
    owner: ProtocolMapper
    domain_of:
    - ProtocolMapper
    range: string
    required: true
  protocolMapper__consent_required:
    name: protocolMapper__consent_required
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:consent_required
    ifabsent: 'false'
    alias: consent_required
    owner: ProtocolMapper
    domain_of:
    - ProtocolMapper
    range: boolean
    required: false
  protocolMapper__config:
    name: protocolMapper__config
    description: Mapper configuration as JSON string.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:config
    alias: config
    owner: ProtocolMapper
    domain_of:
    - ProtocolMapper
    range: string
    required: false
  profileConfig__display_name:
    name: profileConfig__display_name
    description: Profile name shown in jupyterhub spawner.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:display_name
    alias: display_name
    owner: ProfileConfig
    domain_of:
    - ProfileConfig
    range: string
    required: true
  profileConfig__description:
    name: profileConfig__description
    description: Profile description.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:description
    alias: description
    owner: ProfileConfig
    domain_of:
    - ProfileConfig
    range: string
    required: false
  profileConfig__slug:
    name: profileConfig__slug
    description: URL-safe profile identifier.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:slug
    alias: slug
    owner: ProfileConfig
    domain_of:
    - ProfileConfig
    range: string
    required: true
  profileConfig__kubespawner_override:
    name: profileConfig__kubespawner_override
    description: KubeSpawner overrides for this profile.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:kubespawner_override
    alias: kubespawner_override
    owner: ProfileConfig
    domain_of:
    - ProfileConfig
    range: KubespawnerOverride
    required: false
    inlined: true
    inlined_as_list: true
  kubespawnerOverride__image:
    name: kubespawnerOverride__image
    description: Container image for the workspace.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:image
    alias: image
    owner: KubespawnerOverride
    domain_of:
    - KubespawnerOverride
