  kubespawnerOverride__env:
    name: kubespawnerOverride__env
    description: Environment variables as JSON string.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:env
    alias: env
    owner: KubespawnerOverride
    domain_of:
    - KubespawnerOverride
    range: string
    required: false
  environmentVariable__name:
    name: environmentVariable__name
    description: Variable name.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: EnvironmentVariable
    domain_of:
    - EnvironmentVariable
    range: string
    required: true
  environmentVariable__value:
    name: environmentVariable__value
    description: Variable value.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:value
    alias: value
    owner: EnvironmentVariable
    domain_of:
    - EnvironmentVariable
    range: string
    required: true
classes:
  cr8tor:
    name: cr8tor
    definition_uri: https://w3id.org/karectl-crates/cr8tor-metamodel/Cr8tor
    description: The root container class for the Cr8tor metamodel, aggregating all
      project data including governance, data ingress, and deployment configuration.
      This class represents the complete state of a Cr8tor project instance.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slots:
    - cr8tor__governance
    - cr8tor__ingress
    - cr8tor__deployment
    attributes:
      governance:
        name: governance
        description: The governance configuration for the project, managing user access,
          membership, and project metadata. Required.
        range: Governance
        required: true
      ingress:
        name: ingress
        description: The data ingress configuration for the project, specifying data
          sources, destinations, and datasets involved in data movement. Required.
        range: Ingress
        required: true
      deployment:
        name: deployment
        description: The deployment configuration for the project, detailing the resources
          and environment to be provisioned. Required.
        range: Deployment
        required: true
    class_uri: cr8tor_metamodel:Cr8tor
    tree_root: true
  Governance:
    name: Governance
    definition_uri: https://w3id.org/karectl-crates/governance-model/Governance
    description: Represents the governance structure of a Cr8tor project, encapsulating
      user access control, project membership, and mandatory project metadata. This
      class manages the relationships between users and the project, ensuring proper
      access and compliance with governance requirements.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slots:
    - governance__project
    - governance__users
    attributes:
      project:
        name: project
        description: The project entity governed by this governance model, containing
          core project metadata and state.
        range: Project
        required: true
        multivalued: false
        inlined_as_list: true
      users:
        name: users
        description: List of users who have access to the project, each with their
          own roles, permissions, and membership details. Represents the state of
          project membership and access control.
        range: User
        multivalued: true
        inlined_as_list: true
    class_uri: cr8tor_metamodel:Governance
  Project:
    name: Project
    definition_uri: https://w3id.org/karectl-crates/governance-model/Project
    description: Defines the core state and identifying properties of a Cr8tor project,
      including its name, description, and reference information. This class models
      the essential metadata required to uniquely identify and describe a project
      within the Cr8tor ecosystem.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - schemaorg:Project
    slots:
    - project__id
    - project__name
    - project__description
    - project__reference
    - project__start_time
    - project__actions
    attributes:
      id:
        name: id
        description: Unique identifier for the project
        range: string
        required: false
      name:
        name: name
        description: The unique name of the Cr8tor project, used for identification
          and reference within the system.
        range: string
      description:
        name: description
        description: A brief summary describing the purpose, scope, or objectives
          of the Cr8tor project.
        range: string
      reference:
        name: reference
        description: An external or internal reference identifier for the Cr8tor project,
          used for cross-referencing or linking to related resources.
        range: string
      start_time:
        name: start_time
        description: Timestamp when project was created
        range: string
        required: false
      actions:
        name: actions
        description: List of actions performed on the cr8tor project
        range: Action
        multivalued: true
        inlined_as_list: true
    class_uri: cr8tor_metamodel:Project
  Action:
    name: Action
    definition_uri: https://w3id.org/karectl-crates/governance-model/Action
    description: Represents an action or activity performed on a Cr8tor project, tracking
      the lifecycle  and state changes of the project. Based on schema.org Action
      and the Provenance Crate Profile  specification. Actions track operations like
      create, assess, validate, etc.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - schemaorg:Action
    slots:
    - action_type
    - action__id
    - action__name
    - action__start_time
    - action__end_time
    - action__action_status
    - action__agent
    - action__instrument
    - action__result
    - action__error
    attributes:
      id:
        name: id
        description: Unique identifier for the action, typically formatted as '{command_type}-{project_id}'.
        identifier: true
        range: string
        required: true
      name:
        name: name
        description: Human-readable name describing the action (e.g., "CREATE Data
          Project Action").
        range: string
        required: true
      start_time:
        name: start_time
        description: The date and time when the action started execution.
        range: datetime
        required: true
      end_time:
        name: end_time
        description: The date and time when the action completed or failed.
        range: datetime
        required: true
      action_status:
        name: action_status
        description: The current status of the action, indicating whether it's active,
          completed, failed, or potential. Formatted based on schema.org ActionStatus
          and Provenance Crate Profile specification.
        range: ActionStatusType
        required: true
      agent:
        name: agent
        description: The agent (person, organization, or software) that triggered
          or performed the action. Can reference a Person, Organization, or SoftwareApplication
          entity.
        range: string
        required: true
      instrument:
        name: instrument
        description: The tool or service that executed the action (e.g., 'cr8tor CLI',
          'GitHub Action',  specific TRE service). Maps to schema.org Action.instrument.
        range: string
        required: false
      result:
        name: result
        description: List of result items produced by the action, typically ID references
          to other  data or context entities created or modified by the action.
        range: string
        required: false
        multivalued: true
        inlined_as_list: true
      error:
        name: error
        description: Error message or output if the action failed. Only present when
          action_status is FailedActionStatus.
        range: string
        required: false
    class_uri: cr8tor_metamodel:Action
  CreateAction:
    name: CreateAction
    definition_uri: https://w3id.org/karectl-crates/governance-model/CreateAction
    description: Represents a create action performed on a Cr8tor project, typically
      used to track project initialization and creation events. Inherits all properties
      from Action.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - schemaorg:CreateAction
    is_a: Action
    slots:
    - action_type
    - action__id
    - action__name
    - action__start_time
    - action__end_time
    - action__action_status
    - action__agent
    - action__instrument
    - action__result
    - action__error
    class_uri: cr8tor_metamodel:CreateAction
  AssessAction:
    name: AssessAction
    definition_uri: https://w3id.org/karectl-crates/governance-model/AssessAction
    description: Represents an assessment action performed on a Cr8tor project, used
      to track validation, disclosure checks, and other evaluation activities. Inherits
      all properties from Action and adds an optional additional_type for sub-assessments.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - schemaorg:AssessAction
    is_a: Action
    slots:
    - action_type
    - action__id
    - action__name
    - action__start_time
    - action__end_time
    - action__action_status
    - action__agent
    - action__instrument
    - action__result
    - action__error
    - assessAction__additional_type
    attributes:
      additional_type:
        name: additional_type
        description: Additional type classification for specialized actions, used
          to reference sub-actions  or specific assessment types (e.g., 'disclosure
          check' for AssessAction).
        range: string
        required: false
    class_uri: cr8tor_metamodel:AssessAction
  User:
    name: User
    definition_uri: https://w3id.org/karectl-crates/governance-model/User
    description: Models an individual user associated with a Cr8tor project, capturing
      their identity, contact information, organizational affiliation, group memberships,
      and access lifecycle. This class represents the state of a user's relationship
      to the project and their access rights.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - schemaorg:Person
    - schemaorg:Organization
    - scim:User
    slots:
    - user__id
    - user__username
    - user__given_name
    - user__family_name
    - user__affiliation
    - user__email
    - user__groups
    - user__start_date
    - user__expiry_date
    - user__enabled
    - user__password
    attributes:
      id:
        name: id
        description: A globally unique identifier for the user, ensuring unambiguous
          reference within and across systems.
        slot_uri: schemaorg:identifier
        identifier: true
        range: uriorcurie
      username:
        name: username
        description: The user's unique login or account name, used for authentication
          and identification within the project.
        slot_uri: schemaorg:identifier
        range: uriorcurie
      given_name:
        name: given_name
        description: The user's first or given name, representing their personal identity.
        slot_uri: schemaorg:name
      family_name:
        name: family_name
        description: The user's last or family name, used for identification and display
          purposes.
      affiliation:
        name: affiliation
        description: The name of the organization or institution with which the user
          is affiliated, representing their organizational context.
      email:
        name: email
        description: The user's email address, used for communication and notifications
          related to the project.
      groups:
        name: groups
        description: List of groups to which the user belongs within the project,
          representing roles, permissions, or organizational units.
        range: Group
        required: false
        multivalued: true
        inlined_as_list: true
      start_date:
        name: start_date
        description: The date and time when the user's access to the project becomes
          active, representing the start of their membership or role.
        range: datetime
      expiry_date:
        name: expiry_date
        description: The date and time when the user's access to the project expires,
          representing the end of their membership or role.
        range: datetime
      enabled:
        name: enabled
        description: Whether the user account is enabled.
        ifabsent: 'true'
        range: boolean
        required: false
      password:
        name: password
        description: Optional initial password. If not set, the operator generates
          a temporary password.
        range: string
        required: false
    class_uri: cr8tor_metamodel:User
  Group:
    name: Group
    definition_uri: https://w3id.org/karectl-crates/governance-model/Group
    description: Represents a group or organizational unit within a Cr8tor project,
      used to organize users, assign roles, and manage permissions. This class models
      the state of group membership and its associated metadata.
    from_schema: https://w3id.org/karectl-crates/governance-model
    narrow_mappings:
    - scim:Group
    slots:
    - group__value
    - group__ref
    - group__display
    - group__type
    attributes:
      value:
        name: value
        annotations:
          mutability:
            tag: mutability
            value: readOnly
        description: The unique identifier of the group, typically used as the group
          ID for referencing and access control. Read-only.
        range: string
        required: false
      ref:
        name: ref
        annotations:
          mutability:
            tag: mutability
            value: readOnly
          reference_type:
            tag: reference_type
            value: Group
        description: The URI reference to the corresponding Group resource, enabling
          linkage to external or internal group definitions. Read-only.
        range: uri
        required: false
      display:
        name: display
        annotations:
          mutability:
            tag: mutability
            value: readOnly
        description: A human-readable display name for the group, used for UI and
          reporting. Read-only.
        range: string
        required: false
      type:
        name: type
        annotations:
          mutability:
            tag: mutability
            value: readOnly
        description: The type of group membership, indicating how the user was assigned
          to the group (e.g., manual or automatic). Read-only.
        range: GroupMembershipType
        required: false
    class_uri: cr8tor_metamodel:Group
  Ingress:
    name: Ingress
    definition_uri: https://w3id.org/karectl-crates/data-model/Ingress
    description: Represents the data ingress process for a Cr8tor project, modeling
      the flow of data from sources to destinations, and the datasets involved. This
      class captures the state of data movement and configuration for project data
      pipelines.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - ingress__source
    - ingress__destination
    - ingress__datasets
    attributes:
      source:
        name: source
        description: The origin or source of data for the ingress process, representing
          where data is extracted from. Optional.
        range: Source
        required: false
      destination:
        name: destination
        description: The target or endpoint where data is delivered during the ingress
          process, representing the state of data delivery. Required.
        range: Destination
        required: true
      datasets:
        name: datasets
        description: List of datasets involved in the ingress process, each representing
          a collection of data to be transferred. Optional, can include multiple datasets.
        range: Dataset
        required: false
        multivalued: true
        inlined_as_list: true
    class_uri: cr8tor_metamodel:Ingress
  Source:
    name: Source
    definition_uri: https://w3id.org/karectl-crates/data-model/Source
    description: Models a data source within a Cr8tor project, representing the origin
      of data to be ingested. This class defines the state and configuration of external
      or internal data sources.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - source__name
    - source__type
    - source__url
    - source__credentials
    attributes:
      name:
        name: name
        description: The name of the data source, used for identification and reference.
        range: string
        required: false
      type:
        name: type
        description: The type of data source (e.g., databricks, postgresql, mssql,
          filestore).
        range: string
        required: false
      url:
        name: url
        description: The URL or location of the data source, specifying where data
          can be accessed or retrieved from.
        range: string
      credentials:
        name: credentials
        description: The credentials required to access the data source, including
          authentication provider and key references.
        range: Credential
        required: false
    class_uri: cr8tor_metamodel:Source
  Credential:
    name: Credential
    definition_uri: https://w3id.org/karectl-crates/data-model/Credential
    description: Models authentication credentials for accessing a data source, including
      the provider and references to password and username keys stored in a secure
      credential store.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - credential__provider
    - credential__password_key
    - credential__username_key
    attributes:
      provider:
        name: provider
        description: The credential provider or authentication service (e.g., Azure
          Key Vault, AWS Secrets Manager, HashiCorp Vault).
        range: string
        required: true
      password_key:
        name: password_key
        description: The key or identifier used to retrieve the password from the
          credential provider.
        range: string
        required: true
      username_key:
        name: username_key
        description: The key or identifier used to retrieve the username from the
          credential provider.
        range: string
        required: true
    class_uri: cr8tor_metamodel:Credential
  Destination:
    name: Destination
    definition_uri: https://w3id.org/karectl-crates/data-model/Destination
    description: Models a data destination within a Cr8tor project, representing the
      endpoint where data is delivered or stored after ingress. This class defines
      the state and configuration of data targets.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - destination__type
    - destination__url
    attributes:
      type:
        name: type
        description: The type of destination (e.g., filestore, postgresql), specifying
          the nature of the data endpoint. Required.
        range: DestinationType
        required: true
      url:
        name: url
        description: The URL or location of the data destination, specifying where
          data should be delivered. Optional.
        range: string
        required: false
    class_uri: cr8tor_metamodel:Destination
  Dataset:
    name: Dataset
    definition_uri: https://w3id.org/karectl-crates/data-model/Dataset
    description: Represents a dataset to be ingested or managed within a Cr8tor project,
      including its metadata, schema, tables, and data locations. This class models
      the state and structure of data collections handled by the project.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - dataset__name
    - dataset__schema_name
    - dataset__tables
    - dataset__locations
    attributes:
      name:
        name: name
        description: The name of the dataset, used for identification and reference
          within the project. Required.
        range: string
        required: true
      schema_name:
        name: schema_name
        description: The name of the schema in the target database where the dataset
          will reside. Required.
        range: string
        required: true
      tables:
        name: tables
        description: List of tables that make up the dataset, each representing a
          structured collection of columns and data. Optional, can include multiple
          tables.
        range: Table
        required: false
        multivalued: true
        inlined_as_list: true
      locations:
        name: locations
        description: List of data locations or URIs where the dataset is stored or
          accessed during the TRE ingestion workflow. Accepts arbitrary data structures
          including dictionaries. Optional, can include multiple locations.
        range: Location
        required: false
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: cr8tor_metamodel:Dataset
  Location:
    name: Location
    definition_uri: https://w3id.org/karectl-crates/data-model/Location
    description: Represents a data location with flexible attributes to accommodate
      various storage types and metadata.
    from_schema: https://w3id.org/karectl-crates/data-model
    mappings:
    - linkml:Any
    class_uri: linkml:Any
  Table:
    name: Table
    definition_uri: https://w3id.org/karectl-crates/data-model/Table
    description: Models a table within a dataset, representing a structured collection
      of data organized into columns. This class defines the state and schema of tabular
      data in the project.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - table__name
    - table__columns
    attributes:
      name:
        name: name
        description: The name of the table, used for identification within the dataset.
          Required.
        range: string
        required: true
      columns:
        name: columns
        description: List of columns that define the schema of the table, each representing
          a data field. Required, can include multiple columns.
        range: Column
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: cr8tor_metamodel:Table
  Column:
    name: Column
    definition_uri: https://w3id.org/karectl-crates/data-model/Column
    description: Models a column within a table, representing a single field of data
      with a specific datatype. This class defines the state and schema of individual
      data fields in tabular structures.
    from_schema: https://w3id.org/karectl-crates/data-model
    slots:
    - column__name
    - column__datatype
    attributes:
      name:
        name: name
        description: The name of the column, used for identification within the table.
          Required.
        range: string
        required: true
      datatype:
        name: datatype
        description: The datatype of the column, specifying the kind of data stored
          (e.g., string, integer). Required.
        range: string
        required: true
    class_uri: cr8tor_metamodel:Column
  Deployment:
    name: Deployment
    definition_uri: https://w3id.org/karectl-crates/deployment-model/Deployment
    description: Models the deployment configuration for a Cr8tor project, specifying
      the K8TRE resources and applications to be provisioned, as well as the target
      environment. This class represents the state and desired configuration for project
      deployments.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slots:
    - deployment__resources
    - deployment__environment
    attributes:
      resources:
        name: resources
        description: List of resource names or identifiers representing the K8TRE
          applications or services to be deployed as part of the project. Can include
          multiple resources.
        range: Resource
        multivalued: true
        inlined_as_list: true
