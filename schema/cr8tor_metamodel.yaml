name: cr8tor-metamodel
description: Cr8tor metamodel project
title: cr8tor-metamodel
see_also:
- https://karectl-crates.github.io/cr8tor-metamodel
id: https://w3id.org/karectl-crates/cr8tor-metamodel
imports:
- governance_model
- data_model
- deployment_model
- linkml:types
license: MIT
prefixes:
  cr8tor_metamodel:
    prefix_prefix: cr8tor_metamodel
    prefix_reference: https://w3id.org/karectl-crates/cr8tor-metamodel/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/
  schemaorg:
    prefix_prefix: schemaorg
    prefix_reference: http://schema.org/
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  example:
    prefix_prefix: example
    prefix_reference: https://example.org/
default_prefix: cr8tor_metamodel
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  GroupMembershipType:
    name: GroupMembershipType
    definition_uri: https://w3id.org/karectl-crates/governance-model/GroupMembershipType
    description: Type of TRE group membership
    from_schema: https://w3id.org/karectl-crates/governance-model
    permissible_values:
      Manual:
        text: Manual
        description: Manually assigned group membership
      Automatic:
        text: Automatic
        description: Automatically assigned group membership
  ActionType:
    name: ActionType
    definition_uri: https://w3id.org/karectl-crates/governance-model/ActionType
    description: Types of actions that can be performed on a Cr8tor project
    from_schema: https://w3id.org/karectl-crates/governance-model
    permissible_values:
      Action:
        text: Action
        description: Generic action type
      CreateAction:
        text: CreateAction
        description: Action to create or initialize a project
      AssessAction:
        text: AssessAction
        description: Action to assess or evaluate a project (e.g., validation, disclosure
          check)
      UpdateAction:
        text: UpdateAction
        description: Action to update project metadata or resources
      OrchestrationAction:
        text: OrchestrationAction
        description: Action to orchestrate deployment or provisioning
  ActionStatusType:
    name: ActionStatusType
    definition_uri: https://w3id.org/karectl-crates/governance-model/ActionStatusType
    description: Status states for actions, based on schema.org ActionStatusType
    from_schema: https://w3id.org/karectl-crates/governance-model
    permissible_values:
      ActiveActionStatus:
        text: ActiveActionStatus
        description: Action is currently in progress
      CompletedActionStatus:
        text: CompletedActionStatus
        description: Action completed successfully
      FailedActionStatus:
        text: FailedActionStatus
        description: Action failed with errors
      PotentialActionStatus:
        text: PotentialActionStatus
        description: Action is potential but not yet started
  DestinationType:
    name: DestinationType
    definition_uri: https://w3id.org/karectl-crates/data-model/DestinationType
    from_schema: https://w3id.org/karectl-crates/data-model
    permissible_values:
      filestore:
        text: filestore
        description: Filestore endpoint
      postgresql:
        text: postgresql
        description: PostgreSQL database endpoint
  ConnectionType:
    name: ConnectionType
    definition_uri: https://w3id.org/karectl-crates/deployment-model/ConnectionType
    description: VDI connection protocols.
    from_schema: https://w3id.org/karectl-crates/deployment-model
    permissible_values:
      rdp:
        text: rdp
        description: Remote Desktop Protocol.
      vnc:
        text: vnc
        description: Virtual Network Computing.
slots:
  action_type:
    name: action_type
    definition_uri: https://w3id.org/karectl-crates/governance-model/action_type
    description: The specific type of action being performed (e.g., CreateAction,
      AssessAction).
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:action_type
    designates_type: true
    owner: Action
    domain_of:
    - Action
    range: string
    required: true
  resource_type:
    name: resource_type
    definition_uri: https://w3id.org/karectl-crates/deployment-model/resource_type
    description: The type of resource (e.g., Jupyter, Keycloak, VDI).
    from_schema: https://w3id.org/karectl-crates/deployment-model
    slot_uri: cr8tor_metamodel:resource_type
    designates_type: true
    owner: Resource
    domain_of:
    - Resource
    range: string
    required: true
  cr8tor__governance:
    name: cr8tor__governance
    description: The governance configuration for the project, managing user access,
      membership, and project metadata. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:governance
    alias: governance
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Governance
    required: true
    inlined: true
    inlined_as_list: true
  cr8tor__ingress:
    name: cr8tor__ingress
    description: The data ingress configuration for the project, specifying data sources,
      destinations, and datasets involved in data movement. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:ingress
    alias: ingress
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Ingress
    required: true
    inlined: true
    inlined_as_list: true
  cr8tor__deployment:
    name: cr8tor__deployment
    description: The deployment configuration for the project, detailing the resources
      and environment to be provisioned. Required.
    from_schema: https://w3id.org/karectl-crates/cr8tor-metamodel
    slot_uri: cr8tor_metamodel:deployment
    alias: deployment
    owner: cr8tor
    domain_of:
    - cr8tor
    range: Deployment
    required: true
    inlined: true
    inlined_as_list: true
  governance__project:
    name: governance__project
    description: The project entity governed by this governance model, containing
      core project metadata and state.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:project
    alias: project
    owner: Governance
    domain_of:
    - Governance
    range: Project
    required: true
    multivalued: false
    inlined: true
    inlined_as_list: true
  governance__users:
    name: governance__users
    description: List of users who have access to the project, each with their own
      roles, permissions, and membership details. Represents the state of project
      membership and access control.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:users
    alias: users
    owner: Governance
    domain_of:
    - Governance
    range: User
    multivalued: true
    inlined: true
    inlined_as_list: true
  project__id:
    name: project__id
    description: Unique identifier for the project
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:id
    alias: id
    owner: Project
    domain_of:
    - Project
    range: string
    required: false
  project__name:
    name: project__name
    description: The unique name of the Cr8tor project, used for identification and
      reference within the system.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: Project
    domain_of:
    - Project
    range: string
  project__description:
    name: project__description
    description: A brief summary describing the purpose, scope, or objectives of the
      Cr8tor project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:description
    alias: description
    owner: Project
    domain_of:
    - Project
    range: string
  project__reference:
    name: project__reference
    description: An external or internal reference identifier for the Cr8tor project,
      used for cross-referencing or linking to related resources.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:reference
    alias: reference
    owner: Project
    domain_of:
    - Project
    range: string
  project__start_time:
    name: project__start_time
    description: Timestamp when project was created
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:start_time
    alias: start_time
    owner: Project
    domain_of:
    - Project
    range: string
    required: false
  project__actions:
    name: project__actions
    description: List of actions performed on the cr8tor project
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:actions
    alias: actions
    owner: Project
    domain_of:
    - Project
    range: Action
    multivalued: true
    inlined: true
    inlined_as_list: true
  action__id:
    name: action__id
    description: Unique identifier for the action, typically formatted as '{command_type}-{project_id}'.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:id
    identifier: true
    alias: id
    owner: Action
    domain_of:
    - Action
    range: string
    required: true
  action__name:
    name: action__name
    description: Human-readable name describing the action (e.g., "CREATE Data Project
      Action").
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:name
    alias: name
    owner: Action
    domain_of:
    - Action
    range: string
    required: true
  action__start_time:
    name: action__start_time
    description: The date and time when the action started execution.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:start_time
    alias: start_time
    owner: Action
    domain_of:
    - Action
    range: datetime
    required: true
  action__end_time:
    name: action__end_time
    description: The date and time when the action completed or failed.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:end_time
    alias: end_time
    owner: Action
    domain_of:
    - Action
    range: datetime
    required: true
  action__action_status:
    name: action__action_status
    description: The current status of the action, indicating whether it's active,
      completed, failed, or potential. Formatted based on schema.org ActionStatus
      and Provenance Crate Profile specification.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:action_status
    alias: action_status
    owner: Action
    domain_of:
    - Action
    range: ActionStatusType
    required: true
  action__agent:
    name: action__agent
    description: The agent (person, organization, or software) that triggered or performed
      the action. Can reference a Person, Organization, or SoftwareApplication entity.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:agent
    alias: agent
    owner: Action
    domain_of:
    - Action
    range: string
    required: true
  action__instrument:
    name: action__instrument
    description: The tool or service that executed the action (e.g., 'cr8tor CLI',
      'GitHub Action',  specific TRE service). Maps to schema.org Action.instrument.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:instrument
    alias: instrument
    owner: Action
    domain_of:
    - Action
    range: string
    required: false
  action__result:
    name: action__result
    description: List of result items produced by the action, typically ID references
      to other  data or context entities created or modified by the action.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:result
    alias: result
    owner: Action
    domain_of:
    - Action
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
  action__error:
    name: action__error
    description: Error message or output if the action failed. Only present when action_status
      is FailedActionStatus.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:error
    alias: error
    owner: Action
    domain_of:
    - Action
    range: string
    required: false
  assessAction__additional_type:
    name: assessAction__additional_type
    description: Additional type classification for specialized actions, used to reference
      sub-actions  or specific assessment types (e.g., 'disclosure check' for AssessAction).
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:additional_type
    alias: additional_type
    owner: AssessAction
    domain_of:
    - AssessAction
    range: string
    required: false
  user__id:
    name: user__id
    description: A globally unique identifier for the user, ensuring unambiguous reference
      within and across systems.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schemaorg:identifier
    slot_uri: schemaorg:identifier
    identifier: true
    alias: id
    owner: User
    domain_of:
    - User
    range: uriorcurie
    required: true
  user__username:
    name: user__username
    description: The user's unique login or account name, used for authentication
      and identification within the project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schemaorg:identifier
    slot_uri: schemaorg:identifier
    alias: username
    owner: User
    domain_of:
    - User
    range: uriorcurie
  user__given_name:
    name: user__given_name
    description: The user's first or given name, representing their personal identity.
    from_schema: https://w3id.org/karectl-crates/governance-model
    mappings:
    - schemaorg:name
    slot_uri: schemaorg:name
    alias: given_name
    owner: User
    domain_of:
    - User
    range: string
  user__family_name:
    name: user__family_name
    description: The user's last or family name, used for identification and display
      purposes.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:family_name
    alias: family_name
    owner: User
    domain_of:
    - User
    range: string
  user__affiliation:
    name: user__affiliation
    description: The name of the organization or institution with which the user is
      affiliated, representing their organizational context.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:affiliation
    alias: affiliation
    owner: User
    domain_of:
    - User
    range: string
  user__email:
    name: user__email
    description: The user's email address, used for communication and notifications
      related to the project.
    from_schema: https://w3id.org/karectl-crates/governance-model
    slot_uri: cr8tor_metamodel:email
    alias: email
